<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b23a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hanzi & Harf — Chinese & Arabic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f23;--mute:#6b6f76;--line:#e4e0d6;--acc:#b23a2e;--acc-soft:#f6e3df;--ok:#2e7d4f;--ok-soft:#e3f1e8;--bad:#b23a2e;--bad-soft:#f9e3df;--r:14px}
body.ar{--acc:#1f6f55;--acc-soft:#dcefe7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.zh{font-family:"Noto Sans SC",sans-serif}
.arf{font-family:"Noto Naskh Arabic",serif;direction:rtl}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--acc)}
.seg{display:flex;background:#ebe7de;border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:14px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{flex:1;padding:4px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.goal{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.goal .stat{flex:1}
.goal small,.muted{color:var(--mute);font-size:13px}
.prog{height:8px;background:#ece8df;border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.unit{margin-bottom:18px}
.uh{margin:0 2px 8px}
.uh .un{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);font-weight:700}
.uh h3{margin:2px 0 0;font-size:18px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.lrow .dot{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.lrow.done .dot{background:var(--ok)}
.lrow.locked{opacity:.55}
.lrow.locked .dot{background:#cfcac0}
.lrow b{display:block;font-weight:600}
.lrow small{color:var(--mute);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs svg{width:22px;height:22px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{background:#d8d3c9;color:#fff}
.btn.okb{background:var(--ok)}
.row{display:flex;gap:10px}
.row>*{flex:1}
h2{font-size:20px;margin:6px 0 12px}
/* lesson */
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lhead .bar{flex:1;height:10px;background:#e6e1d7;border-radius:99px;overflow:hidden}
.lhead .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.hearts{color:var(--acc);font-weight:700;white-space:nowrap}
.icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.ex{flex:1;padding:6px 16px 170px}
.kind{font-size:13px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.07em;margin:6px 0 4px}
.q{font-size:20px;font-weight:600;margin:0 0 16px}
.big{text-align:center;padding:20px 10px}
.big .t{font-size:56px;line-height:1.3}
.big .t.arf{font-size:46px}
.big .p{color:var(--mute);font-size:18px;margin-top:4px}
.big .f{font-size:18px;margin-top:10px;font-weight:600}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;margin:4px}
.play.huge{width:96px;height:96px;padding:0;font-size:34px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-size:17px;min-height:58px}
.opt .tg{font-size:26px;display:block}
.opt .tg.arf{font-size:24px}
.opt small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.25;pointer-events:none}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:18px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:8px 12px;font-size:22px}
.tok.arf{font-size:22px}
.tok.used{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:528px;margin:0 auto}
.foot.ok{background:var(--ok-soft);border-color:#bfe0cb}
.foot.bad{background:var(--bad-soft);border-color:#efc4bd}
.fb{margin-bottom:10px}
.fb b{font-size:17px}
.foot.ok .fb b{color:var(--ok)}
.foot.bad .fb b{color:var(--bad)}
.fb div{margin-top:3px}
.trace{display:flex;justify-content:center;margin:6px 0 10px}
.trace canvas{background:#fff;border-radius:12px;touch-action:none;border:1px solid var(--line)}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:8px}
.result{text-align:center;padding:40px 16px}
.result .xp{font-size:44px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.lt .arf{font-size:30px;line-height:1.4}
.lt small{display:block;color:var(--mute);font-size:12px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:12px 0}
.forms div{background:var(--bg);border-radius:10px;padding:8px 2px}
.forms .arf{font-size:30px}
.forms small{display:block;font-size:11px;color:var(--mute)}
.dict input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;margin-bottom:10px;background:var(--card)}
.drow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.drow .w{font-size:22px;min-width:84px}
.drow .w.arf{font-size:21px;text-align:right}
.drow .m{flex:1}
.drow .m small{display:block;color:var(--mute)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.sw{width:48px;height:28px;border-radius:99px;background:#d8d3c9;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:23px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats .card{padding:12px;text-align:center}
.stats b{font-size:22px;display:block}
.fc{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.tones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tones .opt{padding:10px 4px}
.sectitle{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:700;margin:22px 0 8px}
.warn{background:#fff7e0;border:1px solid #efdca5;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.tabs button{font-size:11px}
.scard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.scard .em{font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;flex:none}
.scard b{display:block}.scard small{color:var(--mute);font-size:13px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.ctrl button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.ctrl button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sent{padding:12px;border-radius:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);transition:background .2s}
.sent.now{border-color:var(--acc);background:var(--acc-soft)}
.stoks{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:flex-start}
.wd{display:inline-flex;flex-direction:column;align-items:center;padding:3px 3px;border-radius:7px;line-height:1.2}
.wd:hover,.wd.hl{background:var(--acc-soft)}
.wd .wt{font-size:25px}.wd .wt.arf{font-size:25px;line-height:1.6}
.wd .wp{font-size:11px;color:var(--mute);margin-top:1px;white-space:nowrap}
.pn{font-size:24px;padding:3px 1px;line-height:1.2}
.srow{display:flex;gap:6px;margin-top:8px;align-items:center}
.srow button{font-size:13px;color:var(--acc);font-weight:600;padding:4px 8px;border-radius:8px;background:var(--acc-soft)}
.tr{margin-top:8px;color:var(--mute);font-size:15px}
.mk{text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
</style>
</head>
<body>
<div id="app" translate="no" class="notranslate"></div>
<script src="data.js"></script>
<script src="grammar.js"></script>
<script>
Object.values(STORIES).forEach(list=>list.forEach(st=>{st.sents=st.s.map(line=>{const[a,tr]=line.split('||');return{tr,toks:a.split('|').map(x=>{const[t,p,g]=x.split('~');return p===undefined?{t,punct:true}:{t,p,g}})}})}));
function prep(lang,units){
 units.forEach(u=>u.lessons.forEach(l=>{
  if(l.letters){l.items=l.letters.map(a=>({id:lang+':'+a[0],t:a[0],p:a[1],f:'sound: '+a[2],say:a[3],letter:a,lang}))}
  else l.items=l.w.map(x=>{const[t,p,f]=x.split('|');return{id:lang+':'+t,t,p,f,say:t,lang}});
  l.sents=(l.s||[]).map(x=>{const[t,p,f]=x.split('|');return{tok:t.split(' '),p,f}});
 }));return units}
const COURSE={zh:prep('zh',ZH),ar:prep('ar',AR)};
const ALL={};['zh','ar'].forEach(g=>{const m=new Map();COURSE[g].forEach(u=>u.lessons.forEach(l=>l.items.forEach(it=>m.set(it.id,it))));ALL[g]=[...m.values()]});
const TONE_EXTRA=[['妈','mā'],['麻','má'],['马','mǎ'],['骂','mà'],['诗','shī'],['十','shí'],['使','shǐ'],['是','shì'],['八','bā'],['拔','bá'],['把','bǎ'],['爸','bà'],['汤','tāng'],['糖','táng'],['躺','tǎng'],['烫','tàng']].map(([t,p])=>({t,p,say:t}));

/* ============ ÉTAT ============ */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF={lang:'zh',xp:0,days:{},streak:0,last:null,done:{zh:{},ar:{}},srs:{},stories:{},custom:{},gram:{},set:{rom:true,auto:true,slow:false,goal:30}};
let P=Object.assign(JSON.parse(JSON.stringify(DEF)),store.get('hh_v2',{}));
P.set=Object.assign({},DEF.set,P.set);P.stories=P.stories||{};P.gram=P.gram||{};P.custom=P.custom||{};P.done=Object.assign({zh:{},ar:{}},P.done);
const save=()=>store.set('hh_v2',P);
let S={learn:'lessons',gram:null,gans:{},vb:0,vt:'past',vq:null,story:null,tab:'course',lesson:null,modal:null,review:null,tone:null,q:''};

/* ============ OUTILS ============ */
const $=s=>document.querySelector(s);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tcls=g=>g==='zh'?'zh':'arf';
const sep=g=>g==='zh'?'':' ';
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
let voices=[],audioWarned=false;
function audioMissing(){if(audioWarned){toast('Audio unavailable — see Profile › Fix audio');return}audioWarned=true;S.modal=audioHelp();render()}
function audioHelp(){return `<h2>Audio is not working</h2>
 <p class="muted">The app uses your phone’s built-in voices. In the Claude app preview there is no audio — open the installed app or Chrome instead.</p>
 <ol style="padding-left:18px;line-height:1.6"><li>Open the app in <b>Google Chrome</b> (or the installed app).</li><li>Phone <b>Settings › System › Languages &amp; input › Text-to-speech output</b>: engine = <b>Speech Services by Google</b>.</li><li>Tap the ⚙️ next to it › <b>Install voice data</b> › download <b>Chinese (Mandarin)</b> and <b>Arabic</b>.</li><li>Close and reopen the app, then test in <b>Profile › Audio</b>.</li></ol>
 <button class="btn" onclick="closeModal()">OK</button>`}
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const voiceFor=g=>voices.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(g==='zh'?'zh-cn':'ar'))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(g));
function speak(text,g,slow,cb){
 try{if(!('speechSynthesis' in window)){audioMissing();return}if(!voices.length)loadVoices();if(voices.length&&!voiceFor(g)){toast((g==='zh'?'Chinese':'Arabic')+' voice not installed — see Profile › Fix audio')}
 const u=new SpeechSynthesisUtterance(text);u.lang=g==='zh'?'zh-CN':'ar-SA';const v=voiceFor(g);if(v)u.voice=v;
 u.rate=(slow||P.set.slow)?0.6:0.9;if(cb)u.onend=cb;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){audioMissing()}}
function toneOf(p){const m={'ā':1,'ē':1,'ī':1,'ō':1,'ū':1,'ǖ':1,'á':2,'é':2,'í':2,'ó':2,'ú':2,'ǘ':2,'ǎ':3,'ě':3,'ǐ':3,'ǒ':3,'ǔ':3,'ǚ':3,'à':4,'è':4,'ì':4,'ò':4,'ù':4,'ǜ':4};for(const c of p)if(m[c])return m[c];return 0}
const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const yKey=()=>{const y=new Date();y.setDate(y.getDate()-1);return dayKey(y)};
function addXP(n){const k=dayKey();P.days[k]=(P.days[k]||0)+n;P.xp+=n;if(P.last!==k){P.streak=P.last===yKey()?P.streak+1:1;P.last=k}save()}
const streak=()=>(P.last===dayKey()||P.last===yKey())?P.streak:0;
const todayXP=()=>P.days[dayKey()]||0;
const DAY=864e5,INT=[1,2,4,8,16,32];
const romOn=()=>P.set.rom;
function wordHTML(it,size){return `<span class="tg ${tcls(it.lang)}">${it.t}</span>${romOn()?`<small>${it.p}</small>`:''}`}

/* ============ PARCOURS ============ */
const flat=g=>{const a=[];COURSE[g].forEach((u,ui)=>u.lessons.forEach((l,li)=>a.push(ui+'-'+li)));return a};
function unlocked(g,ui,li){const f=flat(g),i=f.indexOf(ui+'-'+li);return i===0||!!P.done[g][f[i-1]]||!!P.done[g][f[i]]}

const ICON={
 course:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
 review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>',
 tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 stories:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'};

function render(){
 document.body.className=P.lang==='ar'?'ar':'';
 const app=$('#app');
 if(S.lesson){app.innerHTML=renderLesson();after();return}
 let main='';
 if(S.tab==='course')main=viewCourse();
 else if(S.tab==='review')main=viewReview();
 else if(S.tab==='stories')main=viewStories();
 else if(S.tab==='tools')main=viewTools();
 else main=viewMe();
 app.innerHTML=`<div class="top"><div class="brand">Hanzi <span>&</span> Harf</div>
 <div class="seg"><button class="${P.lang==='zh'?'on':''}" onclick="setLang('zh')"><span class="zh">中文</span></button><button class="${P.lang==='ar'?'on':''}" onclick="setLang('ar')"><span class="arf">العربية</span></button></div></div>
 <main>${main}</main>
 <nav class="tabs"><div>${[['course','Learn'],['stories','Stories'],['review','Review'],['tools',P.lang==='zh'?'Tools':'Alphabet'],['me','Profile']].map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${ICON[k]}${n}</button>`).join('')}</div></nav>
 ${S.modal?`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${S.modal}</div></div>`:''}`;
 after();
}
function after(){document.querySelectorAll('[data-trace]').forEach(initTrace)}
function setLang(g){stopRead();S.gram=null;S.vq=null;if(g==='zh'&&S.learn==='verbs')S.learn='grammar';P.lang=g;save();S.review=null;S.tone=null;S.story=null;render()}
function go(t){stopRead();S.tab=t;S.review=null;S.story=null;window.scrollTo(0,0);render()}
function closeModal(){S.modal=null;render()}

function goalHTML(){const t=todayXP(),g=P.set.goal;return `<div class="card goal"><div class="stat"><small>Daily goal</small><div class="chip">${Math.min(t,g)} / ${g} XP</div><div class="prog"><i style="width:${Math.min(100,t/g*100)}%"></i></div></div>
 <div style="text-align:center"><div class="chip" style="color:var(--acc)">🔥 ${streak()}</div><small>day streak</small></div>
 <div style="text-align:center"><div class="chip">${P.xp}</div><small>total XP</small></div></div>`}

function openLesson(ui,li){
 const g=P.lang;if(!unlocked(g,ui,li)){toast('Finish the previous lesson first');return}
 const les=COURSE[g][ui].lessons[li];
 S.lesson={g,ui,li,les,q:buildQueue(g,les),i:0,hearts:5,first:0,mist:0,sel:null,state:'ask',built:[]};
 if('speechSynthesis' in window)loadVoices();
 render();autoAudio()}
function buildQueue(g,les){
 const items=les.items,q=[];
 items.forEach(it=>{q.push({k:'intro',it});q.push({k:'mcq',it})});
 const pr=[];
 items.forEach((it,i)=>{pr.push({k:i%2?'rev':'listen',it});if(g==='zh'&&[...it.t].length===1&&toneOf(it.p))pr.push({k:'tone',it})});
 const rec=pickRecall(g,6,new Set(items.map(i=>i.id)));
 rec.forEach((it,i)=>{const ex={k:['mcq','rev','listen'][i%3],it,recall:true};if(i<3)q.unshift(ex);else pr.push(ex)});
 q.push(...shuffle(pr));
 if(items.length>=3)q.push({k:'match',items:shuffle(items.slice()).slice(0,5)});
 les.sents.forEach(s=>{q.push({k:'build',s});q.push({k:'speak',s})});
 const wr=items.filter(it=>g==='zh'?[...it.t].length<=2:!!it.letter);
 shuffle(wr.slice()).slice(0,g==='zh'?2:3).forEach(it=>q.push({k:'write',it}));
 return q}
function optsFor(ex,key){
 if(ex.opts)return ex.opts;const L=S.lesson;
 const pool=shuffle(L.les.items.filter(x=>x[key]!==ex.it[key]).concat(shuffle(ALL[L.g].filter(x=>x[key]!==ex.it[key])).slice(0,6)));
 const seen=new Set([ex.it[key]]),o=[ex.it];for(const x of pool){if(o.length>=4)break;if(!seen.has(x[key])){seen.add(x[key]);o.push(x)}}
 return ex.opts=shuffle(o)}
const KINDS={intro:'New word',mcq:'Meaning',rev:'Translate',listen:'Listening',tone:'Tones',match:'Match',build:'Build the sentence',speak:'Speaking',write:'Writing'};
function playBtn(text,g,label){return `<button class="play" onclick="speak(${JSON.stringify(text).replace(/"/g,'&quot;')},'${g}')">🔊 ${label||'Listen'}</button><button class="play" onclick="speak(${JSON.stringify(text).replace(/"/g,'&quot;')},'${g}',true)">🐢 Slow</button>`}
function renderLesson(){
 const L=S.lesson,ex=L.q[L.i],g=L.g;
 if(L.end)return L.end;
 const pct=Math.round(L.i/L.q.length*100);

 const it=ex.it,dis=L.state!=='ask'?'style="pointer-events:none"':'';

  if(it.letter){const f=forms(it.letter);h+=`<div class="forms">${f.map(([n,v])=>`<div><div class="arf">${v||'—'}</div><small>${n}</small></div>`).join('')}</div><p class="note">Arabic letters change shape depending on their position in the word.${it.letter[4]?'':' This letter never connects to the next one.'}</p>`}
 }
 else if(ex.k==='mcq'){

 }
 else if(ex.k==='listen'){
  const o=optsFor(ex,'t');h+=`<p class="q">Listen and pick the right word</p><div class="big"><button class="play huge" onclick="speak(${JSON.stringify(it.say).replace(/"/g,'&quot;')},'${g}')">🔊</button><br><button class="play" onclick="speak(${JSON.stringify(it.say).replace(/"/g,'&quot;')},'${g}',true)">🐢 Slow</button></div><div class="opts two" ${dis}>${o.map((x,i)=>`<button class="opt ${cls(x.t,it.t)}" onclick="pick('${i}')"><span class="tg ${tcls(g)}">${x.t}</span>${L.state!=='ask'&&romOn()?`<small>${x.p}</small>`:''}</button>`).join('')}</div>`;
 }
 else if(ex.k==='tone'){
  const ans=toneOf(it.p);h+=`<p class="q">Which tone do you hear?</p><div class="big"><div class="t zh">${it.t}</div><div style="margin-top:8px">${playBtn(it.say,g)}</div></div><div class="tones" ${dis}>${[1,2,3,4].map(n=>`<button class="opt ${cls(n,ans)}" onclick="pickTone(${n})"><b>${['','ā','á','ǎ','à'][n]}</b><small>tone ${n}</small></button>`).join('')}</div>${L.state!=='ask'?`<p class="note">${it.t} = ${it.p} (${it.f})</p>`:''}`;
 }
 else if(ex.k==='match'){
  if(!ex.L){ex.L=shuffle(ex.items.slice());ex.R=shuffle(ex.items.slice());ex.done=[];ex.a=null;ex.bad=null}
  h+=`<p class="q">Match each word with its meaning</p><div class="match"><div class="opts">${ex.L.map((x,i)=>`<button class="opt ${ex.done.includes(x.id)?'gone':''} ${ex.a===x.id?'sel':''} ${ex.bad&&ex.bad[0]===x.id?'wrong':''}" onclick="mL(${i})">${wordHTML(x)}</button>`).join('')}</div><div class="opts">${ex.R.map((x,i)=>`<button class="opt ${ex.done.includes(x.id)?'gone':''} ${ex.bad&&ex.bad[1]===x.id?'wrong':''}" style="font-size:15px" onclick="mR(${i})">${x.f}</button>`).join('')}</div></div>`;
 }
 else if(ex.k==='build'){
  if(!ex.bank){const extra=shuffle(L.les.items.filter(x=>!x.t.includes(' ')&&!ex.s.tok.includes(x.t)).map(x=>x.t)).slice(0,2);ex.bank=shuffle(ex.s.tok.concat(extra))}
  h+=`<p class="q">Translate: <span class="mk">“${ex.s.f}”</span></p><div class="ans" dir="${g==='ar'?'rtl':'ltr'}">${L.built.map((bi,j)=>`<button class="tok ${tcls(g)}" onclick="unbuild(${j})">${ex.bank[bi]}</button>`).join('')}</div><div class="bank" dir="${g==='ar'?'rtl':'ltr'}" ${dis}>${ex.bank.map((t,i)=>`<button class="tok ${tcls(g)} ${L.built.includes(i)?'used':''}" onclick="build(${i})">${t}</button>`).join('')}</div>`;
 }
 else if(ex.k==='speak'){
  const txt=ex.s.tok.join(sep(g));h+=`<p class="q">Listen, then repeat the sentence aloud</p><div class="big card"><div class="t ${tcls(g)}" style="font-size:${g==='zh'?40:34}px">${txt}</div><div class="p">${ex.s.p}</div><div class="f">${ex.s.f}</div><div style="margin-top:12px">${playBtn(txt,g)}</div></div><p class="note">Repeat several times, copying the voice as closely as you can, then continue.</p>`;
 }
 else if(ex.k==='write'){
  h+=`<p class="q">Trace the ${it.letter?'letter':'character'} over the model</p><div style="text-align:center"><span class="${tcls(g)}" style="font-size:26px">${it.t}</span> · <span class="muted">${it.p} — ${it.f}</span></div><div class="trace" data-trace="${esc(it.t)}" data-lang="${g}" id="tr"></div><div class="row"><button class="btn sec" onclick="$('#tr')._undo()">Undo stroke</button><button class="btn sec" onclick="$('#tr')._clear()">Clear</button></div>${g==='zh'?'<p class="note">Stroke order: top to bottom, left to right, horizontal before vertical.</p>':'<p class="note">Arabic is written from right to left.</p>'}`;
 }
 h+='</div>'+footHTML(ex);return h}
function footHTML(ex){
 const L=S.lesson,g=L.g;
 const direct=['intro','speak','write'].includes(ex.k);
 if(direct)return `<div class="foot"><div class="in"><button class="btn" onclick="next()">${ex.k==='speak'?'I said it':ex.k==='write'?'Done':'Continue'}</button></div></div>`;
 if(ex.k==='match')return L.state==='ok'?`<div class="foot ok"><div class="in"><div class="fb"><b>Perfect!</b></div><button class="btn okb" onclick="next()">Continue</button></div></div>`:'';
 if(L.state==='ask'){const can=ex.k==='build'?L.built.length>0:L.sel!==null;return `<div class="foot"><div class="in"><button class="btn" ${can?'':'disabled'} onclick="check()">Check</button></div></div>`}
 let ans='';
 if(ex.k==='mcq')ans=ex.it.f;else if(ex.k==='tone')ans=ex.it.p;else if(ex.k==='build')ans=`<span class="${tcls(g)}" style="font-size:20px">${ex.s.tok.join(sep(g))}</span><br><small>${ex.s.p}</small>`;else ans=`<span class="${tcls(g)}" style="font-size:20px">${ex.it.t}</span> — ${ex.it.p} · ${ex.it.f}`;
 return `<div class="foot ${L.state}"><div class="in"><div class="fb"><b>${L.state==='ok'?'Nice!':'Not quite.'}</b><div>${L.state==='ok'&&ex.k!=='build'?ans:'Correct answer: '+ans}</div></div><button class="btn ${L.state==='ok'?'okb':''}" onclick="next()">Continue</button></div></div>`}
function pick(i){const L=S.lesson,ex=L.q[L.i];const x=ex.opts[+i];L.sel=ex.k==='mcq'?x.f:x.t;if(ex.k!=='mcq'&&ex.k!=='listen')speak(x.say,L.g);render()}
function pickTone(n){S.lesson.sel=n;render()}
function build(i){const L=S.lesson;if(L.state!=='ask'||L.built.includes(i))return;L.built.push(i);const ex=L.q[L.i];speak(ex.bank[i],L.g);render()}
function unbuild(j){const L=S.lesson;if(L.state!=='ask')return;L.built.splice(j,1);render()}
function mL(i){const ex=S.lesson.q[S.lesson.i];ex.a=ex.L[i].id;ex.bad=null;speak(ex.L[i].say,S.lesson.g);render()}
function mR(i){const L=S.lesson,ex=L.q[L.i];if(!ex.a)return;const r=ex.R[i];
 if(r.id===ex.a){ex.done.push(r.id);ex.a=null;if(ex.done.length===ex.items.length){L.state='ok';L.first++}}
 else{ex.bad=[ex.a,r.id];markEx(L,ex.a,false,L.practice);save();ex.a=null;L.mist++;setTimeout(()=>{ex.bad=null;render()},700)}
 render()}
function check(){
 const L=S.lesson,ex=L.q[L.i];let ok=false;
 if(ex.k==='mcq')ok=L.sel===ex.it.f;
 else if(ex.k==='rev'||ex.k==='listen')ok=L.sel===ex.it.t;
 else if(ex.k==='tone')ok=L.sel===toneOf(ex.it.p);
 else if(ex.k==='build')ok=L.built.map(i=>ex.bank[i]).join('|')===ex.s.tok.join('|');
 L.state=ok?'ok':'bad';
 if(ex.it&&!ex.retry){markEx(L,ex.it.id,ok,ex.recall);save()}
 if(ok){if(!ex.retry)L.first++;if(ex.k==='build')speak(ex.s.tok.join(sep(L.g)),L.g);else speak(ex.it.say,L.g)}
 else{L.hearts--;L.mist++;const c=Object.assign({},ex,{retry:true,opts:null,bank:null});L.q.push(c)}
 render()}
function next(){
 const L=S.lesson;
 if(L.hearts<=0){L.end=`<div class="result"><div style="font-size:54px">💔</div><h2>Out of hearts</h2><p class="muted">No problem — restart the lesson, it will go faster the second time.</p><div style="margin-top:24px" class="row"><button class="btn sec" onclick="quitLesson(true)">Quit</button><button class="btn" onclick="${L.practice?`startPractice('${L.practice}')`:`openLesson(${L.ui},${L.li})`}">Restart</button></div></div>`;render();return}
 L.i++;L.sel=null;L.state='ask';L.built=[];
 if(L.i>=L.q.length){finish();return}

function autoAudio(){const L=S.lesson;if(!L||!P.set.auto)return;const ex=L.q[L.i];if(!ex)return;
 if(['intro','listen','tone'].includes(ex.k))setTimeout(()=>speak(ex.it.say,L.g),250);
 else if(ex.k==='speak')setTimeout(()=>speak(ex.s.tok.join(sep(L.g)),L.g),250)}
function finish(){
 const L=S.lesson,g=L.g,k=L.ui+'-'+L.li,firstTime=!L.practice&&!P.done[g][k];
 const xp=L.practice?Math.max(3,L.les.items.length-L.mist):(firstTime?10:5)+Math.max(0,10-L.mist);

 if(!L.practice){P.done[g][k]=true;
  L.les.items.forEach(it=>{const v=P.srs[it.id],bad=L.bad&&L.bad.has(it.id);
   if(!v)P.srs[it.id]={box:0,due:now+(bad?REDO:DAY),lang:g,weak:!!bad,bad:bad?1:0,streak:0};
   else if(bad)Object.assign(v,{weak:true,box:0,due:now+REDO,bad:(v.bad||0)+1,streak:0})})}
 save();addXP(xp);
 const nw=L.bad?[...L.bad].map(findItem).filter(Boolean):[];
 const acc=Math.round(L.first/Math.max(1,L.first+L.mist)*100);
 L.end=`<div class="result"><div style="font-size:54px">🎉</div><h2>${L.practice?'Review complete!':'Lesson complete!'}</h2><div class="xp">+${xp} XP</div>
 <div class="stats" style="margin-top:20px"><div class="card"><b>${acc}%</b><small class="muted">accuracy</small></div><div class="card"><b>${L.les.items.length}</b><small class="muted">${L.les.letters?'letters':'words'}</small></div><div class="card"><b>🔥 ${streak()}</b><small class="muted">streak</small></div></div>
 ${nw.length?`<div class="card" style="margin-top:14px;text-align:left"><small class="muted">To practise again — these words will come back until you master them</small><div style="margin-top:6px">${nw.map(it=>`<div><span class="${tcls(g)}" style="font-size:19px">${it.t}</span> <small class="muted">${it.p} · ${it.f}</small></div>`).join('')}</div></div>`:''}
 ${todayXP()>=P.set.goal?'<p class="muted">Daily goal reached ✓</p>':`<p class="muted">${P.set.goal-todayXP()} XP to go for today’s goal.</p>`}
 <div style="margin-top:20px"><button class="btn" onclick="quitLesson(true)">Continue</button></div></div>`;
 render()}

function initTrace(el){
 const ch=el.dataset.trace,g=el.dataset.lang,size=Math.min((el.clientWidth||300)-4,300),dpr=window.devicePixelRatio||1;
 const c=document.createElement('canvas');c.width=size*dpr;c.height=size*dpr;c.style.width=c.style.height=size+'px';el.innerHTML='';el.appendChild(c);
 const x=c.getContext('2d');x.scale(dpr,dpr);let strokes=[],cur=null;
 function draw(){
  x.clearRect(0,0,size,size);x.strokeStyle='#ebe5d8';x.lineWidth=1;x.setLineDash([5,5]);x.beginPath();
  x.moveTo(size/2,0);x.lineTo(size/2,size);x.moveTo(0,size/2);x.lineTo(size,size/2);
  if(g==='zh'){x.moveTo(0,0);x.lineTo(size,size);x.moveTo(size,0);x.lineTo(0,size)}x.stroke();x.setLineDash([]);
  const n=[...ch].length,fs=g==='zh'?size*0.8/n:size*0.55;
  x.fillStyle='#ddd6c8';x.textAlign='center';x.textBaseline='middle';
  x.font=g==='zh'?`${fs}px "Noto Sans SC",sans-serif`:`${fs}px "Noto Naskh Arabic",serif`;
  x.fillText(ch,size/2,g==='zh'?size/2+fs*0.03:size*0.42);
  x.strokeStyle='#1d1f23';x.lineWidth=Math.max(6,size/26/(g==='zh'?Math.max(1,n*0.75):1));x.lineCap='round';x.lineJoin='round';
  strokes.forEach(s=>{x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));if(s.length===1)x.lineTo(s[0][0]+.1,s[0][1]);x.stroke()})}
 const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 c.addEventListener('pointerdown',e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}cur=[pos(e)];strokes.push(cur);draw()});
 c.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();cur.push(pos(e));draw()});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>c.addEventListener(t,()=>cur=null));
 el._clear=()=>{strokes=[];draw()};el._undo=()=>{strokes.pop();draw()};
 draw();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw)}
function forms(a){const l=a[0],T='ـ';return [['Isolated',l],['Initial',a[4]?l+T:null],['Medial',a[4]?T+l+T:null],['Final',T+l]]}

 if(!mine.length)return `<h2>Spaced review</h2><div class="card"><p class="muted">Finish a lesson to add words here.</p></div>`;
 return `<h2>Spaced review</h2><div class="card">
 <div class="stats" style="margin:0"><div><b class="chip" style="font-size:26px">${st.due}</b><small class="muted" style="display:block">due now</small></div><div><b class="chip" style="font-size:26px;color:var(--bad,#c0392b)">${st.weak}</b><small class="muted" style="display:block">weak</small></div><div><b class="chip" style="font-size:26px;color:var(--ok)">${st.mastered}</b><small class="muted" style="display:block">mastered</small></div></div>
 <div class="prog" style="margin-top:12px"><i style="width:${Math.round(st.mastered/st.total*100)}%"></i></div><small class="muted">${st.mastered} / ${st.total} words mastered · ${st.learning} still learning</small>
 <div style="margin-top:14px;display:grid;gap:8px">
 ${st.due?`<button class="btn" onclick="startPractice('due')">Practise due words (${Math.min(15,st.due)})</button>`:''}
 ${st.weak?`<button class="btn ${st.due?'sec':''}" onclick="startPractice('weak')">Work on weak words (${Math.min(12,st.weak)})</button>`:''}
 ${st.due?`<button class="btn sec" onclick="startReview(false)">Flashcards (${Math.min(20,st.due)})</button>`:`<p class="muted" style="margin:0">Nothing due. Next review: ${next?new Date(next[1].due).toLocaleDateString('en-GB',{weekday:'long',hour:'2-digit',minute:'2-digit'}):'—'}</p><button class="btn ${st.weak?'sec':''}" onclick="startPractice('mix')">Mixed review anyway</button>`}</div>
 <p class="muted" style="margin-top:12px;font-size:13px">A word you know comes back after 1, 2, 4, 8, 16 and 32 days. A word you get wrong becomes <b>weak</b>: it comes back after 10 minutes, at the start of every new lesson and here, until you get it right 3 times in a row. A word is <b>mastered</b> once it reaches the 16-day step.</p></div>
 ${weakL.length?`<div class="sectitle">Weak words</div><div class="card" style="padding:4px 12px">${weakL.slice(0,40).map(([it,v])=>`<div class="drow" ${sayBtnAttr(it.say,g)}><div class="m"><span class="${tcls(g)}" style="font-size:20px">${it.t}</span><small>${it.p} · ${it.f}</small></div><small class="muted">✗ ${v.bad||1}</small></div>`).join('')}</div>`:''}`}
const REDO=10*60e3,MASTER=4;
function srsResult(id,g,ok){const now=Date.now(),v=P.srs[id]||(P.srs[id]={box:0,due:now+DAY,lang:g});
 if(ok){v.streak=(v.streak||0)+1;if(v.due<=now){v.box=Math.min(v.box+1,5);v.due=now+INT[v.box]*DAY}if(v.weak&&v.streak>=3)v.weak=false}
 else Object.assign(v,{weak:true,box:0,due:now+REDO,bad:(v.bad||0)+1,streak:0})}
function markEx(L,id,ok,recall){if(recall||L.practice)srsResult(id,L.g,ok);else if(!ok)(L.bad||(L.bad=new Set())).add(id)}
function srsStats(g){const now=Date.now(),m=Object.values(P.srs).filter(v=>v.lang===g);
 const mastered=m.filter(v=>v.box>=MASTER&&!v.weak).length;
 return{total:m.length,due:m.filter(v=>v.due<=now).length,weak:m.filter(v=>v.weak).length,mastered,learning:m.length-mastered}}
function pickRecall(g,n,excl){const now=Date.now(),mine=Object.entries(P.srs).filter(([id,v])=>v.lang===g&&!excl.has(id)&&findItem(id));
 const due=shuffle(mine.filter(([i,v])=>v.due<=now)).sort((a,b)=>(b[1].weak?1:0)-(a[1].weak?1:0));
 const weak=shuffle(mine.filter(([i,v])=>v.weak&&v.due>now));
 const rest=shuffle(mine.filter(([i,v])=>!v.weak&&v.due>now)).sort((a,b)=>a[1].box-b[1].box);
 const out=[];for(const[id]of[...due,...weak,...rest]){if(out.length>=n)break;if(!out.includes(id))out.push(id)}
 return out.map(findItem)}
function startPractice(mode){const g=P.lang,now=Date.now(),mine=Object.entries(P.srs).filter(([id,v])=>v.lang===g&&findItem(id));
 let ids=mode==='weak'?shuffle(mine.filter(([i,v])=>v.weak)).slice(0,12):mode==='due'?shuffle(mine.filter(([i,v])=>v.due<=now)).sort((a,b)=>(b[1].weak?1:0)-(a[1].weak?1:0)).slice(0,15):[];
 let items=ids.length?ids.map(([id])=>findItem(id)):pickRecall(g,12,new Set());
 if(!items.length){toast('No words to review yet');return}
 const q=[];items.forEach(it=>q.push({k:'mcq',it,recall:true}));
 const pr=items.map((it,i)=>({k:i%2?'rev':'listen',it,recall:true}));q.push(...shuffle(pr));
 if(items.length>=3)q.push({k:'match',items:shuffle(items.slice()).slice(0,5)});
 S.lesson={g,practice:mode,les:{items,sents:[]},q,i:0,hearts:Infinity,first:0,mist:0,sel:null,state:'ask',built:[]};
 window.scrollTo(0,0);render();autoAudio()}
function startReview(any){const g=P.lang,now=Date.now();let ids=Object.entries(P.srs).filter(([id,v])=>v.lang===g&&(any||v.due<=now)).map(([id])=>id).filter(id=>findItem(id));
 ids=shuffle(ids).slice(0,any?10:20);S.review={list:ids,i:0,shown:false,known:0,seen:ids.length,xp:0,again:{}};render();if(P.set.auto){const it=findItem(ids[0]);if(it)speak(it.say,g)}}
function rate(k){const R=S.review,id=R.list[R.i],v=P.srs[id],now=Date.now();
 if(k){if(!R.again[id])R.known++;v.box=Math.min(v.box+1,5);v.due=now+INT[v.box]*DAY;R.xp+=1;v.streak=(v.streak||0)+1;if(v.weak&&v.streak>=3)v.weak=false}
 else{v.box=0;v.due=now+REDO;v.weak=true;v.bad=(v.bad||0)+1;v.streak=0;if(!R.again[id]){R.again[id]=1;R.list.push(id)}}
 R.i++;R.shown=false;if(R.i>=R.list.length&&R.xp)addXP(R.xp);save();render();
 if(R.i<R.list.length&&P.set.auto){const it=findItem(R.list[R.i]);if(it)speak(it.say,P.lang)}}

const RAD={'ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y'};
const VM={a:'َ',i:'ِ',u:'ُ'},SK='ْ';
const PRON=[['هُوَ','huwa','he'],['هُمَا','humā','they two (m)'],['هُمْ','hum','they (m)'],['هِيَ','hiya','she'],['هُمَا','humā','they two (f)'],['هُنَّ','hunna','they (f)'],['أَنْتَ','anta','you (m)'],['أَنْتُمَا','antumā','you two'],['أَنْتُمْ','antum','you (m pl)'],['أَنْتِ','anti','you (f)'],['أَنْتُنَّ','antunna','you (f pl)'],['أَنَا','anā','I'],['نَحْنُ','naḥnu','we']];
const PAST_SUF=[['َ','a'],['َا','ā'],['ُوا','ū'],['َتْ','at'],['َتَا','atā'],['ْنَ','na'],['ْتَ','ta'],['ْتُمَا','tumā'],['ْتُمْ','tum'],['ْتِ','ti'],['ْتُنَّ','tunna'],['ْتُ','tu'],['ْنَا','nā']];
const PRE=[['يَ','ya'],['يَ','ya'],['يَ','ya'],['تَ','ta'],['تَ','ta'],['يَ','ya'],['تَ','ta'],['تَ','ta'],['تَ','ta'],['تَ','ta'],['تَ','ta'],['أَ','a'],['نَ','na']];
const ECL=['u','ani','una','u','ani','na','u','ani','una','ina','na','u','u'];
const END={ind:{u:['ُ','u'],ani:['َانِ','āni'],una:['ُونَ','ūna'],ina:['ِينَ','īna'],na:['ْنَ','na']},
 sub:{u:['َ','a'],ani:['َا','ā'],una:['ُوا','ū'],ina:['ِي','ī'],na:['ْنَ','na']},
 jus:{u:['ْ',''],ani:['َا','ā'],una:['ُوا','ū'],ina:['ِي','ī'],na:['ْنَ','na']}};
const TENSES=[['past','Past','الْمَاضِي'],['pres','Present','الْمُضَارِعُ'],['fut','Future','الْمُسْتَقْبَلُ'],['neg','Not (now)','لَا'],['lam','Did not','لَمْ'],['lan','Will not','لَنْ'],['imp','Imperative','الْأَمْرُ'],['proh','Don’t!','لَا النَّاهِيَةُ']];
function conj(v,t){
 const [root,pv,iv]=v,c=[...root],l=c.map(x=>RAD[x]||x);
 const pres=(mood,i)=>{const e=END[mood][ECL[i]];return[PRE[i][0]+c[0]+SK+c[1]+VM[iv]+c[2]+e[0],PRE[i][1]+l[0]+l[1]+iv+l[2]+e[1]]};
 const rows=[];
 PRON.forEach((p,i)=>{let f=null;
  if(t==='past'){const s=PAST_SUF[i];f=[c[0]+VM.a+c[1]+VM[pv]+c[2]+s[0],l[0]+'a'+l[1]+pv+l[2]+s[1]]}
  else if(t==='pres')f=pres('ind',i);
  else if(t==='fut'){const x=pres('ind',i);f=['سَ'+x[0],'sa-'+x[1]]}
  else if(t==='neg'){const x=pres('ind',i);f=['لَا '+x[0],'lā '+x[1]]}
  else if(t==='lam'){const x=pres('jus',i);f=['لَمْ '+x[0],'lam '+x[1]]}
  else if(t==='lan'){const x=pres('sub',i);f=['لَنْ '+x[0],'lan '+x[1]]}
  else if(t==='imp'||t==='proh'){if(i<6||i>10)return;const e=END.jus[ECL[i]];
   if(t==='imp'){const h=iv==='u'?['اُ','u']:['اِ','i'];f=[h[0]+c[0]+SK+c[1]+VM[iv]+c[2]+e[0],h[1]+l[0]+l[1]+iv+l[2]+e[1]]}
   else{const x=pres('jus',i);f=['لَا '+x[0],'lā '+x[1]]}}
  rows.push({i,p,ar:f[0],tr:f[1]})});
 return rows}
function verbHead(v){const r=conj(v,'past')[0],p=conj(v,'pres')[0];return `${r.ar} / ${p.ar}`}
function conjTable(v,t){const rows=conj(v,t);
 return `<div class="card" style="padding:6px 12px">${rows.map(r=>`<div class="drow" style="cursor:pointer" onclick="speak(${JSON.stringify(r.ar).replace(/"/g,'&quot;')},'ar')"><div class="m" style="flex:0 0 38%"><span class="arf" style="font-size:17px">${r.p[0]}</span><small>${r.p[2]}</small></div><div class="m" style="text-align:right"><span class="arf" style="font-size:24px">${r.ar}</span><small>${r.tr}</small></div></div>`).join('')}</div>`}

/* ============ GRAMMAR VIEWS ============ */
const isAr=s=>/[؀-ۿ]/.test(s),isZh=s=>/[一-鿿]/.test(s);
const cellCls=s=>isAr(s)?'arf':isZh(s)?'zh':'';
function sayBtnAttr(t,g){return `onclick="speak(${JSON.stringify(t).replace(/"/g,'&quot;')},'${g}')" style="cursor:pointer"`}
function viewGrammar(){
 const g=P.lang,L=GRAMMAR[g];
 if(S.gram)return grammarLesson(L.find(x=>x.id===S.gram));
 const n=L.filter(x=>P.gram[x.id]).length;
 return `<div class="muted" style="margin:-4px 0 12px">${n} / ${L.length} grammar lessons completed. Each lesson: explanation, examples with audio, then exercises.</div>`+
 L.map((x,i)=>`<button class="lrow ${P.gram[x.id]?'done':''}" onclick="S.gram='${x.id}';S.gans={};window.scrollTo(0,0);render()"><span class="dot">${P.gram[x.id]?'✓':i+1}</span><span style="flex:1;min-width:0"><b>${x.title}</b><small class="${tcls(g)}" style="display:block;font-size:15px">${x.tt}</small></span></button>`).join('')}
function grammarLesson(x){
 const g=P.lang;let h=`<div style="display:flex;align-items:center;gap:8px;margin:0 0 8px"><button class="icon" onclick="S.gram=null;render()">←</button><div><b style="font-size:18px">${x.title}</b><div class="${tcls(g)} muted" style="font-size:17px">${x.tt}</div></div></div>`;
 x.blocks.forEach(b=>{
  if(b.p)h+=`<p style="line-height:1.55">${b.p}</p>`;
  if(b.key)h+=`<div class="card" style="border-left:4px solid var(--acc);margin:12px 0"><small class="muted">Must remember</small><div style="margin-top:4px"><span class="mk">${b.key}</span></div></div>`;
  if(b.ex)h+=`<div class="card" style="padding:4px 12px;margin:12px 0">${b.ex.map(e=>`<div class="drow" ${sayBtnAttr(e[0].replace(/[←→]/g,' '),g)}><div class="m"><div class="${tcls(g)}" style="font-size:${g==='ar'?22:21}px;${g==='ar'?'text-align:right':''}">${e[0]}</div><small>${e[1]}</small><div style="font-size:14px">${e[2]}</div></div><span class="play">🔊</span></div>`).join('')}</div>`;
  if(b.table)h+=`<div class="card" style="padding:8px;margin:12px 0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><tr>${b.table.head.map(c=>`<th style="text-align:left;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)">${c}</th>`).join('')}</tr>${b.table.rows.map(r=>`<tr ${isAr(r[1])||isZh(r[1])?sayBtnAttr(r[1],g):''}>${r.map(c=>`<td class="${cellCls(c)}" style="padding:6px;border-bottom:1px solid var(--line);${isAr(c)?'font-size:19px':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(b.conj){const v=VERBS.find(z=>z[0]===b.conj[0]);h+=`<div class="sectitle">${verbHead(v)} — ${v[3]}</div>`+conjTable(v,b.conj[1])+`<button class="btn sec" style="margin-top:10px" onclick="S.learn='verbs';S.vt='${b.conj[1]}';S.gram=null;render()">Open the conjugator (20 verbs)</button>`}
 });
 h+=`<div class="sectitle">Exercises</div>`;
 x.q.forEach((q,qi)=>{const a=S.gans[qi];h+=`<div class="card" style="margin-bottom:10px"><b>${qi+1}. ${q.q}</b><div class="opts" style="margin-top:10px">${q.o.map((o,oi)=>`<button class="opt ${a===undefined?'':(oi===q.a?'right':(a===oi?'wrong':''))}" ${a!==undefined?'style="pointer-events:none"':''} onclick="gAns(${qi},${oi})"><span class="${cellCls(o)}" style="${isAr(o)||isZh(o)?'font-size:21px':''}">${o}</span></button>`).join('')}</div>${a!==undefined?`<p class="muted" style="margin:10px 0 0">${a===q.a?'✓ ':'✗ '}${q.ex||''}</p>`:''}</div>`});
 const done=Object.keys(S.gans).length===x.q.length;
 if(done){const good=x.q.filter((q,i)=>S.gans[i]===q.a).length;h+=`<div class="card" style="text-align:center"><div class="chip" style="font-size:26px">${good} / ${x.q.length}</div><p class="muted">${good===x.q.length?'Excellent!':'Read the explanation again, then retry.'}</p>${P.gram[x.id]?`<button class="btn sec" onclick="S.gans={};render()">Try again</button>`:`<button class="btn" onclick="finishGram('${x.id}')">Complete lesson (+10 XP)</button>`}</div>`}
 return h}
function gAns(qi,oi){const g=P.lang,x=GRAMMAR[g].find(z=>z.id===S.gram);S.gans[qi]=oi;const o=x.q[qi].o[x.q[qi].a];if(isAr(o)||isZh(o))speak(o,g);render()}
function finishGram(id){if(!P.gram[id]){P.gram[id]=true;addXP(10);toast('+10 XP')}S.gram=null;render()}

/* ============ VERBS (ARABIC CONJUGATOR) ============ */
function viewVerbs(){
 const v=VERBS[S.vb];
 if(S.vq)return verbQuiz();
 return `<div class="card" style="margin-bottom:12px"><small class="muted">Verb</small>
 <select onchange="S.vb=+this.value;render()" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);margin-top:6px;background:var(--card)">${VERBS.map((x,i)=>`<option value="${i}" ${i===S.vb?'selected':''}>${x[3]} — ${verbHead(x)}</option>`).join('')}</select>
 <div style="text-align:center;margin-top:10px" ${sayBtnAttr(conj(v,'past')[0].ar,'ar')}><span class="arf" style="font-size:30px">${verbHead(v)}</span><div class="muted">${conj(v,'past')[0].tr} / ${conj(v,'pres')[0].tr} · ${v[3]}</div></div></div>
 <div class="ctrl">${TENSES.map(([k,n])=>`<button class="${S.vt===k?'on':''}" onclick="S.vt='${k}';render()">${n}</button>`).join('')}</div>
 ${conjTable(v,S.vt)}
 <button class="btn" style="margin-top:14px" onclick="startVQ()">Quiz me on conjugation</button>
 <p class="note">Tap any form to hear it. Regular (sound) verbs only — irregular verbs come in later lessons.</p>`}
function newVQ(){const v=VERBS[Math.floor(Math.random()*VERBS.length)],ts=['past','pres','fut','lam','lan','imp'],t=ts[Math.floor(Math.random()*ts.length)],rows=conj(v,t),r=rows[Math.floor(Math.random()*rows.length)];
 const others=shuffle(rows.filter(x=>x.ar!==r.ar)).slice(0,3);return{v,t,r,opts:shuffle([r,...others]),sel:null}}
function startVQ(){S.vq={n:0,score:0,cur:newVQ()};render()}
function verbQuiz(){const Q=S.vq;
 if(Q.n>=10)return `<div class="result"><div class="xp">${Q.score} / 10</div><p class="muted">correct forms</p><div class="row" style="margin-top:20px"><button class="btn sec" onclick="S.vq=null;render()">Back</button><button class="btn" onclick="startVQ()">Again</button></div></div>`;
 const c=Q.cur,tn=TENSES.find(x=>x[0]===c.t);
 return `<div class="muted">Question ${Q.n+1} / 10 · score ${Q.score}</div>
 <div class="card big" style="margin:10px 0"><div class="arf" style="font-size:26px">${verbHead(c.v)}</div><div class="muted">${c.v[3]}</div>
 <div style="margin-top:12px;font-size:18px"><b>${tn[1]}</b> · <span class="arf">${c.r.p[0]}</span> (${c.r.p[2]})</div></div>
 <div class="opts">${c.opts.map((o,i)=>`<button class="opt ${c.sel===null?'':(o.ar===c.r.ar?'right':(c.sel===i?'wrong':''))}" ${c.sel!==null?'style="pointer-events:none"':''} onclick="vqAns(${i})"><span class="tg arf">${o.ar}</span>${c.sel!==null||romOn()?`<small>${o.tr}</small>`:''}</button>`).join('')}</div>
 ${c.sel!==null?`<div style="margin-top:12px"><button class="btn" onclick="vqNext()">Next</button></div>`:''}`}
function vqAns(i){const c=S.vq.cur;c.sel=i;if(c.opts[i].ar===c.r.ar)S.vq.score++;speak(c.r.ar,'ar');render()}
function vqNext(){const Q=S.vq;Q.n++;if(Q.n>=10&&Q.score)addXP(Q.score);if(Q.n<10)Q.cur=newVQ();render()}

/* ============ INSTALL (PWA) ============ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(S.tab==='me')render()});
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone}catch(e){return false}};
function installHTML(){
 if(standalone())return '<div class="set"><div>App installed ✓</div></div>';
 if(deferredPrompt)return '<div class="set"><div>Install the app<br><small class="muted">Icon on your home screen, works offline</small></div><button class="play" onclick="doInstall()">Install</button></div>';
 return '<div class="set"><div>Install the app<br><small class="muted">In Chrome: menu ⋮ › “Install app” or “Add to Home screen”</small></div></div>'}
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self){navigator.serviceWorker.register('sw.js').catch(()=>{})}}catch(e){}
</script>
</body>
